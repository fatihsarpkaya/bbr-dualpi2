# 5 BBRv1 flows alone through a PI2 bottleneck: 100 Mbps, 30 ms base RTT, 8-BDP buffer, PI2 target 50 ms.
name: bbr1_100mbps_rtt30_target50

common_parameters:
  send_duration: 40  # s
  truncate_front: 0  # s
  truncate_back: 0  # s

varying_parameters:
  senders: [5]
  link_capacity: [100]  # Mbps
  switch_buffer: [15.987903225806452]  # in BDPs of link_latency: 1982 packets = 8 BDPs of the 30 ms base RTT
  cc_combination:
    - [BBR]
  link_latency: [14.9]  # ms; base RTT = 2 * (link_latency + source latency)
  source_latency_range:
    - [0.1, 0.1]  # ms
  qdisc: [PI2]
  pi2_target: [50.0]  # ms
  seed: [1]

model_parameters:
  computation_parameters:
    stp: 0.01  # ms
